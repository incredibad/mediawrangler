# MediaWrangler: one container. Copy .env.example to .env and adjust.
services:
  mediawrangler:
    image: incredibad/mediawrangler:${MW_VERSION:-latest}
    build:
      context: .
      target: runtime
    container_name: mediawrangler
    restart: unless-stopped
    ports:
      - "${MW_PORT:-8790}:${MW_PORT:-8790}"
      # Webhooks from your apps: LAN only, never put this behind the public proxy.
      - "${MW_WEBHOOK_PORT:-8791}:${MW_WEBHOOK_PORT:-8791}"
    env_file: .env
    environment:
      MW_SECRET_KEY_FILE: /run/secrets/mw_secret_key
    volumes:
      - ${MW_HOST_DATA_DIR:-./data}:/data
      # The whole share, read-write, as one mount: moving a file to the trash (.trash on the
      # share) is then an instant rename, not a copy between mounts. MW_MEDIA_FOLDERS in .env
      # names the library folders; nothing else on the share is listed or read. Files are only
      # ever changed with Settings → Writes → File changes switched on.
      - ${MW_HOST_MEDIA_DIR:-/mnt/media}:/media:rw
    secrets:
      - mw_secret_key

secrets:
  mw_secret_key:
    file: ${MW_HOST_SECRET_KEY_FILE:-./secrets/secret.key}
